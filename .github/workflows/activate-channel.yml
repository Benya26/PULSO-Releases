name: Activar canal de actualizaciones PULSO
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: pulso-updates-feed
  cancel-in-progress: false
jobs:
  activate:
    name: Verificar instaladores y activar versión
    if: github.repository == 'Benya26/PULSO-Releases' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Descargar archivos del release ya publicado
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Validar y crear manifiestos de Windows y Android
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --check scripts/channel.mjs
          node scripts/channel.mjs
      - name: Publicar índice sin modificar instaladores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json android.json
          if git diff --cached --quiet; then
            echo "El canal ya estaba actualizado."
          else
            git commit -m "PULSO: actualizar canal firmado a ${{ github.event.release.tag_name }}"
            git push origin main
          fi
